<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Přidání aplikace · před a po</title><style>body{font:16px system-ui;background:#f5f4f0;color:#172724;margin:auto;padding:32px;max-width:1500px}h1{letter-spacing:-.04em}p{max-width:80ch;line-height:1.6}label{margin-right:20px}section{margin-top:40px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{width:100%;border:1px solid #d9ddd6;border-radius:8px}figcaption{font-weight:600;margin-bottom:10px}figure{margin:0}select{padding:8px}@media(max-width:700px){.pair{grid-template-columns:1fr}body{padding:20px}}</style><h1>Přidání aplikace a připojení storů</h1><p>Skutečné Chromium rendery se syntetickými daty. Před: oddělené úzké dialogy. Po: jeden rámec, přehled fází, návrat, dostupné akce a samostatné výsledky platforem. Nejde o živé store účty.</p><label>Šířka <select id="width"><option>1440</option><option>390</option></select></label><label>Výsledné téma <select id="theme"><option value="light">Světlé</option><option value="dark">Tmavé</option></select></label><main></main><script>const width=document.getElementById('width'),theme=document.getElementById('theme');const names={app:'Identita aplikace',google:'Google Play',apple:'App Store Connect'};function render(){document.querySelector('main').innerHTML=Object.entries(names).map(([key,title])=>`<section><h2>${title}</h2><div class="pair"><figure><figcaption>Před · ${width.value} px</figcaption><img src="before/${key}-${width.value}.png" alt="Původní ${title}"></figure><figure><figcaption>Po · ${width.value} px · ${theme.value}</figcaption><img src="after/${key}-${width.value}-${theme.value}.png" alt="Nové ${title}"></figure></div></section>`).join('')}width.onchange=theme.onchange=render;render()</script></html>
