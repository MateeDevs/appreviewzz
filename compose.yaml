# Self-host / lokální vývoj: app + Postgres, nic dalšího.
#   cp .env.example .env && docker compose up

name: appreviewzz

x-app-env: &app-env
  APPREVIEWZZ_ENV: ${APPREVIEWZZ_ENV:-local}
  DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-appreviewzz}
  DATABASE_USER: ${POSTGRES_USER:-appreviewzz}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD musí být nastaveno v .env}
  # Self-host: KEK je lokální keyset na disku (vyrobí se při prvním startu, žije ve volume
  # keyset-data). Kdo chce KMS, přepíše na aws-kms://arn:… Zálohovat spolu s databází —
  # bez keysetu jsou credentials v DB nečitelné.
  VAULT_KEK_URI: ${VAULT_KEK_URI:-local:///var/lib/appreviewzz/keyset}
  # Zálohy (F1.8). Výchozí cíl je volume vedle databáze — to je záloha proti smazané tabulce,
  # ne proti shoření stroje. Runbook říká, jak ji dostat pryč z hostitele nebo rovnou do S3.
  BACKUP_TARGET: ${BACKUP_TARGET:-file:///var/backups/appreviewzz}
  BACKUP_AT: ${BACKUP_AT:-02:30}
  BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
  # AI návrhy odpovědí (F2). Bez klíče se nic nerozbije — do kanálu jde prázdný vstup.
  AI_PROVIDER: ${AI_PROVIDER:-none}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  # Slack App (F2) — bez signing secretu API interactivity endpoint nevystaví.
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appreviewzz}
      POSTGRES_USER: ${POSTGRES_USER:-appreviewzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD musí být nastaveno v .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appreviewzz} -d ${POSTGRES_DB:-appreviewzz}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: appreviewzz:local
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      <<: *app-env
      APPREVIEWZZ_ROLE: api
    volumes:
      - keyset-data:/var/lib/appreviewzz
      # Zálohy jsou tu i u API, protože přes něj se pouští CLI (`backup run`, `backup restore`).
      - backup-data:/var/backups/appreviewzz
    ports:
      - "${API_PORT:-8080}:8080"
      # Metriky jen na loopback — ven nemají co dělat.
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: appreviewzz:local
    environment:
      <<: *app-env
      APPREVIEWZZ_ROLE: worker
      # Migrace pouští API; worker jen čeká, až je schéma hotové.
      DATABASE_MIGRATE_ON_START: "false"
    volumes:
      # Stejný keyset jako API — jinak by worker credentials uložené přes API nerozbalil.
      - keyset-data:/var/lib/appreviewzz
      - backup-data:/var/backups/appreviewzz
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  keyset-data:
  backup-data:
