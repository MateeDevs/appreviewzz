name: CI

on:
  push:
    branches: [master, 'epic/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    # Bez limitu visí zaseknutý krok (naposledy `apt-get` na pgdg mirroru) až do šestihodinového
    # stropu GitHubu a člověk se o tom doví, až když čeká na deploy.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Drill obnovy ze zálohy (F1.8) potřebuje klienta Postgresu stejné nebo vyšší verze,
      # než má testovaný server. Runner má ve výchozím stavu starší — bez tohohle kroku by se
      # nejdůležitější test celé zálohovací cesty tiše přeskočil.
      - name: Klient Postgresu 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "PG_DUMP_PATH=/usr/lib/postgresql/17/bin/pg_dump" >> "$GITHUB_ENV"
          echo "PG_RESTORE_PATH=/usr/lib/postgresql/17/bin/pg_restore" >> "$GITHUB_ENV"

      - name: Build, lint, test
        run: ./gradlew build --no-daemon --stacktrace
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            server/**/build/reports/tests/**
            server/**/build/reports/ktlint/**
          retention-days: 7
          if-no-files-found: ignore

  console:
    name: Console (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        working-directory: console
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: console
        run: npm run lint

      - name: Typecheck a build
        working-directory: console
        run: npm run build

  docker:
    name: Docker image & scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: appreviewzz:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: appreviewzz:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # Zaparkovaný ECS/RDS stack ([ADR 0016](../../docs/adr/0016-produkce-zustava-na-coolify.md))
  # je odložené rozhodnutí, ne mrtvý kód. Bez téhle kontroly by z něj za rok byly moduly,
  # které se nedají spustit — a tím by odložitelnost toho rozhodnutí tiše zmizela.
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Formát
        run: terraform fmt -check -recursive deploy/terraform

      - name: Validace modulů
        run: |
          for module in deploy/terraform/modules/*/; do
            echo "== $module"
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
          done
