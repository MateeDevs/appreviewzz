name: Deploy

on:
  push:
    branches: [epic/v2]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mateedevs/appreviewzz

jobs:
  # Každá architektura se staví na svém nativním runneru — Gradle build pod QEMU
  # emulací trvá násobně dýl než celý zbytek pipeline.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
        env:
          digest: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish manifest & deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${{ github.sha }}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect published image
        run: docker buildx imagetools inspect "$IMAGE:latest"

      # Kontext secrets nejde použít v `if`, proto se propíše do env a testuje se to.
      # Dokud secrets nejsou nastavené, deploy se přeskočí a image se jen publikuje.
      - name: Trigger Coolify deploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "COOLIFY_WEBHOOK_URL není nastavený — deploy přeskočen, image je v GHCR."
            exit 0
          fi

          # Coolify má dva tvary spouštěče a každý bere jinou metodu:
          # API endpoint /api/v1/deploy?uuid=… reaguje na GET, webhook ze
          # záložky Automation → Webhooks na POST. Jinak vrátí 405.
          case "$COOLIFY_WEBHOOK_URL" in
            */api/v1/deploy*) method=GET ;;
            *)                method=POST ;;
          esac
          echo "Spouštím deploy metodou $method."

          status=$(curl --silent --show-error --output /tmp/coolify-response \
            --write-out '%{http_code}' \
            --request "$method" "$COOLIFY_WEBHOOK_URL" \
            --header "Authorization: Bearer $COOLIFY_TOKEN")

          echo "Coolify odpověděl HTTP $status:"
          cat /tmp/coolify-response
          echo

          case "$status" in
            2*) exit 0 ;;
            *)  echo "::error::Coolify deploy se nespustil (HTTP $status)."; exit 1 ;;
          esac
