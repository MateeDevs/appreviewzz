name: Deploy

# Větev je jediná pravda o tom, co kde běží:
#   push do vývojové větve → build, publikace do GHCR a nasazení stagingu
#   push do production     → povýšení té revize do produkce (nic se nestaví znovu)
#
# Na obě větve se smí pushnout naráz. Promote si na image počká sám, takže pořadí ani
# odstup pushů nikoho nezajímají.
#
# Až v2 nahradí master, mění se `epic/v2` na dvou místech vedle sebe: tady a v BUILD_BRANCH.
on:
  push:
    branches: [epic/v2, production]

concurrency:
  # Povýšení do produkce nesmí čekat na běžící staging build a naopak.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Promote se dívá, jak dopadl build téhož commitu.
  actions: read

env:
  IMAGE: ghcr.io/mateedevs/appreviewzz
  BUILD_BRANCH: epic/v2

jobs:
  # Každá architektura se staví na svém nativním runneru — Gradle build pod QEMU
  # emulací trvá násobně dýl než celý zbytek pipeline.
  build:
    name: Build ${{ matrix.platform }}
    if: github.ref_name != 'production'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
        env:
          digest: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish manifest & deploy staging
    if: github.ref_name != 'production'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${{ github.sha }}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect published image
        run: docker buildx imagetools inspect "$IMAGE:latest"

      # Až tady, po publikaci manifestu. Coolify má auto-deploy vypnutý schválně:
      # git webhook chodí v okamžiku pushe, tedy o celý build dřív, než `latest` existuje,
      # a staging by se tím trvale nasazoval o jeden commit pozadu.
      - name: Deploy stagingu
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: deploy/coolify/trigger-deploy.sh "${{ secrets.COOLIFY_STAGING_WEBHOOK_URL }}" staging

  # Produkce se nestaví, jen se povyšuje už postavený image. Tag `prod` je tím pádem
  # jediné místo, kde se rozhoduje, co v produkci běží — a mění se výhradně tímhle krokem.
  promote:
    name: Povýšit do produkce
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    # Prostor pro schvalování a chráněné secrets; bez pravidel se chová jako by tu nebylo.
    environment: production
    # Čeká se na cizí build, takže výchozí šestihodinový strop je tu k ničemu.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Do produkce smí jen revize, která se opravdu postavila. Když se build ještě staví,
      # počká si na něj; když selhal nebo pro ten commit vůbec není, skončí to tady —
      # produkce se v obou případech nezmění.
      - name: Počkat na image pro tenhle commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: deploy/ci/wait-for-image.sh "$IMAGE" "${{ github.sha }}" "$BUILD_BRANCH"

      - name: Přesměrovat tag prod
        run: docker buildx imagetools create --tag "$IMAGE:prod" "$IMAGE:${{ github.sha }}"

      - name: Deploy produkce
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: deploy/coolify/trigger-deploy.sh "${{ secrets.COOLIFY_PROD_WEBHOOK_URL }}" produkce

      - name: Shrnutí
        run: |
          {
            echo "### Produkce nasazena"
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- tag: \`$IMAGE:prod\`"
          } >> "$GITHUB_STEP_SUMMARY"
