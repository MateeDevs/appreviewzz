# Nasazení na Coolify. Image staví CI a publikuje do GHCR — na hostiteli se nic nebuildí.
# Proměnné se vyplňují v Coolify UI, ne tady.

services:
  api:
    image: ghcr.io/mateedevs/appreviewzz:${APP_VERSION:-latest}
    # Bez tohohle by hostitel u pohyblivého tagu 'latest' sáhl po lokální kopii
    # a nasazení by tiše zůstalo viset na první stažené verzi.
    pull_policy: always
    # Deklaruje port pro reverzní proxy, ale nepublikuje ho na hostitele —
    # ven se aplikace dostane výhradně přes Traefik.
    expose:
      - "8080"
    environment:
      APPREVIEWZZ_ROLE: api
      APPREVIEWZZ_ENV: ${APPREVIEWZZ_ENV:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-appreviewzz}
      DATABASE_USER: ${POSTGRES_USER:-appreviewzz}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?}
      DATABASE_MIGRATE_ON_START: "true"
      # Credential vault (F1) — KEK v AWS KMS, viz ADR 0008.
      VAULT_KEK_URI: ${VAULT_KEK_URI}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # Zálohy plánuje worker; API je zná jen proto, aby se přes něj dalo pustit
      # `backup list` a `backup restore` (obnova se dělá z běžícího kontejneru).
      BACKUP_TARGET: ${BACKUP_TARGET}
      # Slack interactivity a install flow běží v API roli; publikaci pak převezme worker.
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # Console (F3): odkazy v e-mailech a odchozí pošta. Bez SMTP jdou e-maily do logu.
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:-}
      MAIL_FROM: ${MAIL_FROM:-appreviewzz@localhost}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/mateedevs/appreviewzz:${APP_VERSION:-latest}
    pull_policy: always
    environment:
      APPREVIEWZZ_ROLE: worker
      APPREVIEWZZ_ENV: ${APPREVIEWZZ_ENV:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-appreviewzz}
      DATABASE_USER: ${POSTGRES_USER:-appreviewzz}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?}
      # Migrace vlastní role api — dvě instance by se přetahovaly o Flyway zámek.
      DATABASE_MIGRATE_ON_START: "false"
      VAULT_KEK_URI: ${VAULT_KEK_URI}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # Noční záloha databáze (F1.8) běží ve workeru — bucket zakládá terraform modul backups.
      BACKUP_TARGET: ${BACKUP_TARGET}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # AI návrhy odpovědí (F2) — vyrábí je worker při doručování recenzí.
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appreviewzz}
      POSTGRES_USER: ${POSTGRES_USER:-appreviewzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appreviewzz} -d ${POSTGRES_DB:-appreviewzz}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
